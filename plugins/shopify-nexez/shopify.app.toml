# Shopify app config (scaffold). Fill client_id from your Partner dashboard and
# run `shopify app deploy`. The server routes it points at live in the main Nexez
# Next app and are DORMANT until SHOPIFY_API_KEY / SHOPIFY_API_SECRET are set.
name = "Nexez Agent-Ready"
client_id = "30ba9ab10150d4eea0dc69b18c85c638"
application_url = "https://app.nexez.ai/api/shopify/launch"
embedded = false

[access_scopes]
scopes = "read_products,write_app_proxy"

[auth]
redirect_urls = [ "https://app.nexez.ai/api/shopify/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://app.nexez.ai/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  name = "product-created"
  topics = [ "products/create" ]
  uri = "https://app.nexez.ai/api/webhooks/shopify"
  include_fields = [ "id", "updated_at" ]

  [[webhooks.subscriptions]]
  name = "product-updated"
  topics = [ "products/update" ]
  uri = "https://app.nexez.ai/api/webhooks/shopify"
  include_fields = [ "id", "updated_at" ]

  [[webhooks.subscriptions]]
  name = "product-deleted"
  topics = [ "products/delete" ]
  uri = "https://app.nexez.ai/api/webhooks/shopify"
  include_fields = [ "id", "updated_at" ]

[app_proxy]
url = "https://app.nexez.ai/api/shopify/proxy"
subpath = "nexez"
prefix = "apps"
