<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="900">
      <stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <linearGradient id="mb" gradientUnits="userSpaceOnUse" x1="900" y1="380" x2="1460" y2="720">
      <stop offset="0" stop-color="#34E5B0"/><stop offset="1" stop-color="#4C9BFF"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="980" y1="0" x2="1380" y2="0">
      <stop offset="0" stop-color="#34E5B0"/><stop offset="1" stop-color="#4C9BFF"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#16223A" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>
  <rect x="120" y="96" width="220" height="34" rx="17" fill="#0F1C33" stroke="#244065"/>
  <text x="230" y="119" fill="#34E5B0" font-size="16" letter-spacing="3" text-anchor="middle">WHY IT MATTERS</text>
  <text x="118" y="200" fill="#EAF1FC" font-size="50" font-weight="bold">Agents shape the shortlist</text>
  <text x="118" y="258" fill="#EAF1FC" font-size="50" font-weight="bold">before a human clicks.</text>

  <!-- left: structured signals stacking into readiness -->
  <text x="160" y="380" fill="#8597B5" font-size="20">Structured signals → readiness</text>
  <g font-size="19">
    <rect x="160" y="404" width="540" height="46" rx="9" fill="#0E1B30" stroke="#26415F"/>
    <text x="186" y="433" fill="#D7E4F5">Offers + pricing</text><text x="680" y="433" fill="#34E5B0" text-anchor="end">+24</text>
    <rect x="160" y="458" width="540" height="46" rx="9" fill="#0E1B30" stroke="#26415F"/>
    <text x="186" y="487" fill="#D7E4F5">Action endpoints</text><text x="680" y="487" fill="#34E5B0" text-anchor="end">+22</text>
    <rect x="160" y="512" width="540" height="46" rx="9" fill="#0E1B30" stroke="#26415F"/>
    <text x="186" y="541" fill="#D7E4F5">schema.org / JSON-LD</text><text x="680" y="541" fill="#34E5B0" text-anchor="end">+18</text>
    <rect x="160" y="566" width="540" height="46" rx="9" fill="#0E1B30" stroke="#26415F"/>
    <text x="186" y="595" fill="#D7E4F5">MCP endpoint</text><text x="680" y="595" fill="#34E5B0" text-anchor="end">+14</text>
    <rect x="160" y="620" width="540" height="46" rx="9" fill="#0E1B30" stroke="#26415F"/>
    <text x="186" y="649" fill="#D7E4F5">llms.txt · freshness</text><text x="680" y="649" fill="#34E5B0" text-anchor="end">+22</text>
  </g>

  <!-- right: shortlist with you highlighted -->
  <text x="900" y="380" fill="#8597B5" font-size="20">The agent's shortlist</text>
  <g font-size="22">
    <rect x="900" y="404" width="560" height="58" rx="11" fill="#0E1B30" stroke="#26415F"/>
    <text x="930" y="440" fill="#5C6E8C" font-size="20">1</text><text x="980" y="440" fill="#8597B5">Competitor — partial data</text>
    <!-- highlighted: you -->
    <rect x="900" y="474" width="560" height="74" rx="12" fill="#0C2A22" stroke="url(#mb)" stroke-width="3"/>
    <text x="930" y="518" fill="#34E5B0" font-size="22" font-weight="bold">★</text>
    <text x="970" y="510" fill="#EAF1FC" font-weight="bold">Your business — agent-ready</text>
    <text x="970" y="536" fill="#7FD9C2" font-size="16">readiness 96 · book · buy · compare</text>
    <rect x="900" y="560" width="560" height="58" rx="11" fill="#0E1B30" stroke="#26415F"/>
    <text x="930" y="596" fill="#5C6E8C" font-size="20">3</text><text x="980" y="596" fill="#8597B5">Competitor — no pricing</text>
    <rect x="900" y="630" width="560" height="58" rx="11" fill="#0E1B30" stroke="#26415F"/>
    <text x="930" y="666" fill="#5C6E8C" font-size="20">4</text><text x="980" y="666" fill="#8597B5">Competitor — cannot transact</text>
  </g>
</svg>
