<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="900">
      <stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <linearGradient id="area" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="640">
      <stop offset="0" stop-color="#34E5B0"/><stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#16223A" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>
  <rect x="120" y="96" width="170" height="34" rx="17" fill="#0F1C33" stroke="#244065"/>
  <text x="205" y="119" fill="#34E5B0" font-size="16" letter-spacing="3" text-anchor="middle">ANALYTICS</text>
  <text x="118" y="200" fill="#EAF1FC" font-size="50" font-weight="bold">See which AI traffic</text>
  <text x="118" y="258" fill="#EAF1FC" font-size="50" font-weight="bold">actually converts.</text>

  <!-- KPI cards -->
  <g>
    <rect x="120" y="330" width="300" height="120" rx="14" fill="#0E1B30" stroke="#26415F"/>
    <text x="146" y="370" fill="#8597B5" font-size="18">Conversions · 30d</text>
    <text x="146" y="420" fill="#34E5B0" font-size="46" font-weight="bold">312</text><text x="280" y="420" fill="#34E5B0" font-size="20">+9.1%</text>
    <rect x="440" y="330" width="300" height="120" rx="14" fill="#0E1B30" stroke="#26415F"/>
    <text x="466" y="370" fill="#8597B5" font-size="18">Pipeline · 30d</text>
    <text x="466" y="420" fill="#4C9BFF" font-size="46" font-weight="bold">$48.2k</text><text x="650" y="420" fill="#4C9BFF" font-size="20">+$7.3k</text>
  </g>

  <!-- area chart -->
  <g>
    <rect x="120" y="478" width="620" height="290" rx="14" fill="#0C1626" stroke="#26415F"/>
    <text x="146" y="512" fill="#8597B5" font-size="18">agent_session · live</text>
    <polygon points="150,700 150,640 240,610 330,628 420,560 510,580 600,520 700,540 700,700" fill="url(#area)" opacity="0.35"/>
    <polyline points="150,640 240,610 330,628 420,560 510,580 600,520 700,540" fill="none" stroke="#34E5B0" stroke-width="3"/>
    <circle cx="420" cy="560" r="5" fill="#34E5B0"/><circle cx="600" cy="520" r="5" fill="#34E5B0"/>
    <line x1="150" y1="700" x2="700" y2="700" stroke="#26415F" stroke-width="1.5"/>
  </g>

  <!-- conversions by agent -->
  <g>
    <rect x="780" y="330" width="680" height="438" rx="14" fill="#0E1B30" stroke="#26415F"/>
    <text x="810" y="372" fill="#D7E4F5" font-size="24" font-weight="bold">Conversions by agent</text>
    <g font-size="20">
      <text x="810" y="430" fill="#D7E4F5">ChatGPT</text>
      <rect x="810" y="444" width="600" height="22" rx="6" fill="#13243C"/><rect x="810" y="444" width="396" height="22" rx="6" fill="#10A37F"/>
      <text x="1430" y="462" fill="#34E5B0" text-anchor="end">44%</text>
      <text x="810" y="514" fill="#D7E4F5">Claude</text>
      <rect x="810" y="528" width="600" height="22" rx="6" fill="#13243C"/><rect x="810" y="528" width="252" height="22" rx="6" fill="#D77655"/>
      <text x="1430" y="546" fill="#E0926F" text-anchor="end">28%</text>
      <text x="810" y="598" fill="#D7E4F5">Perplexity</text>
      <rect x="810" y="612" width="600" height="22" rx="6" fill="#13243C"/><rect x="810" y="612" width="171" height="22" rx="6" fill="#4C9BFF"/>
      <text x="1430" y="630" fill="#4C9BFF" text-anchor="end">19%</text>
      <text x="810" y="682" fill="#D7E4F5">Grok</text>
      <rect x="810" y="696" width="600" height="22" rx="6" fill="#13243C"/><rect x="810" y="696" width="81" height="22" rx="6" fill="#A78BFA"/>
      <text x="1430" y="714" fill="#A78BFA" text-anchor="end">9%</text>
    </g>
  </g>
</svg>
