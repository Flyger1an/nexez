name: Agent Access Smoke

on:
  workflow_dispatch:
  schedule:
    # Keep the public agent distribution surface honest without requiring secrets.
    # Daily rather than 6-hourly: these checks re-assert largely static facts (install
    # strings, registry parity, the cname pointer), and four runs a day across two jobs
    # was roughly 240 job-runs a month to catch drift that changes on the order of
    # weeks. workflow_dispatch is still there for an on-demand check after a release.
    - cron: '17 9 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXEZ_MARKETING_BASE: https://nexez.ai
      NEXEZ_AGENT_BASE: https://nexez.app
      NEXEZ_AGENT_SMOKE_SLUG: nexez-agent-negotiation-lab
      NEXEZ_AGENT_SMOKE_OFFER: services-0
      NEXEZ_AGENT_SMOKE_TIMEOUT_MS: 15000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Smoke public agent access
        run: npm run smoke:agent-access

  openclaw-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXEZ_BASE_URL: https://nexez.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: plugins/openclaw-nexez/package-lock.json
      - run: npm ci --prefix plugins/openclaw-nexez
      - name: Run non-mutating OpenClaw production gauntlet
        run: npm run gauntlet:production --prefix plugins/openclaw-nexez
