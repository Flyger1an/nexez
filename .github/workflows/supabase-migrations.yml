name: Supabase Migrations

# This workflow validates reproducibility but never deploys or links to a remote
# project. `db reset` targets only the ephemeral local Docker stack on the runner,
# replaying every migration from zero. Production application remains an explicit,
# separately authorized operation.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migration-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration filenames
        run: |
          node <<'NODE'
          const fs = require('fs')
          const dir = 'supabase/migrations'
          const files = fs.readdirSync(dir).filter((file) => file.endsWith('.sql')).sort()
          const seen = new Map()
          for (const file of files) {
            const version = file.split('_')[0]
            if (seen.has(version)) {
              console.error(`Duplicate Supabase migration version: ${version}`)
              console.error(`- ${seen.get(version)}`)
              console.error(`- ${file}`)
              process.exit(1)
            }
            seen.set(version, file)
          }
          console.log(`Checked ${files.length} Supabase migration files; no duplicate versions found.`)
          NODE

  clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - name: Start isolated local Supabase
        run: supabase start -x edge-runtime
      - name: Replay every migration from zero
        run: supabase db reset --local
      - name: Lint the resulting schema
        run: supabase db lint --local --level error
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup
