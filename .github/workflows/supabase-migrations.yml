name: Supabase Migrations

# This workflow validates reproducibility but never deploys or links to a remote
# project. `db reset` targets only the ephemeral local Docker stack on the runner,
# replaying every migration from zero. Production application remains an explicit,
# separately authorized operation.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/supabase-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migration-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration filenames
        run: |
          node <<'NODE'
          const fs = require('fs')
          const dir = 'supabase/migrations'
          const files = fs.readdirSync(dir).filter((file) => file.endsWith('.sql')).sort()
          const seen = new Map()
          for (const file of files) {
            const version = file.split('_')[0]
            if (seen.has(version)) {
              console.error(`Duplicate Supabase migration version: ${version}`)
              console.error(`- ${seen.get(version)}`)
              console.error(`- ${file}`)
              process.exit(1)
            }
            seen.set(version, file)
          }
          console.log(`Checked ${files.length} Supabase migration files; no duplicate versions found.`)
          NODE

  clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - name: Start isolated local Supabase
        run: supabase start -x edge-runtime
      - name: Replay every migration from zero
        run: supabase db reset --local
      - name: Lint the resulting schema
        # The bundled pgTAP extension contains compatibility shims that the
        # plpgsql checker cannot type-resolve on PostgreSQL 17. Lint Nexez's
        # application schemas; extension code is vendor-owned and separately
        # exercised by the database tests below.
        run: supabase db lint --local --schema private,public --level error
      - name: Prove Nexxi approval authority boundaries
        run: supabase test db supabase/tests/nexxi_approval_security.test.sql --local
      - name: Prove A2A v1 ledger security boundaries
        run: supabase test db supabase/tests/a2a_v1_ledger_security.test.sql --local
      - name: Prove A2A v1 task lifecycle and Nexxi continuity
        run: supabase test db supabase/tests/a2a_v1_ledger_lifecycle.test.sql --local
      - name: Prove A2A v1 recovery and retention boundaries
        run: supabase test db supabase/tests/a2a_v1_ledger_recovery.test.sql --local
      - name: Prove checkout-session privacy and retention boundaries
        run: supabase test db supabase/tests/checkout_session_privacy.test.sql --local
      - name: Prove seller notification preference ownership
        run: supabase test db supabase/tests/seller_notification_preferences.test.sql --local
      - name: Prove support requester and operator boundaries
        run: supabase test db supabase/tests/support_operations.test.sql --local
      - name: Prove support conversation privacy and delivery evidence
        run: supabase test db supabase/tests/support_operations_v2.test.sql --local
      - name: Prove the canonical plan entitlement contract
        run: supabase test db supabase/tests/plan_entitlements.test.sql --local
      - name: Prove Shopify mapping serialization and lifecycle boundaries
        run: supabase test db supabase/tests/shopify_mapping_serialization.test.sql --local
      - name: Prove seller-growth plan lifecycle
        shell: bash
        run: |
          database_url="$(supabase status -o json | jq -er '.DB_URL')"
          psql "$database_url" -X --set=ON_ERROR_STOP=1 --file=supabase/tests/seller_growth_gauntlet.sql
      - name: Prove entitlement quota and downgrade concurrency
        shell: bash
        run: |
          database_url="$(supabase status -o json | jq -er '.DB_URL')"
          DATABASE_URL="$database_url" bash supabase/tests/plan_entitlements_concurrency.sh
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup
