name: Supabase Migrations

# Source of truth for migrations is the Supabase MCP `apply_migration` (see AGENTS.md:
# "Never `supabase db push`" — the DB schema is authoritative via MCP, and the
# schema_migrations history table is reconciled out-of-band via the periodic
# "clean supabase migration history" commits). This workflow therefore VALIDATES the
# migration files; it does NOT deploy.
#
# A previous `deploy-migrations` job ran `supabase db push` on push to main. It was
# removed because it (1) duplicated the MCP apply path, (2) perpetually failed — the
# schema_migrations history intentionally drifts from the files, so `db push` tried to
# re-apply already-existing objects, and (3) used supabase/setup-cli@v1, the repo's
# only action flagged by GitHub's Node-runtime deprecation. A working `db push` here
# would also be a footgun: it could conflict with / clobber MCP-applied state.
# Security advisors are run via the Supabase MCP `get_advisors` instead of in CI.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migration-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration filenames
        run: |
          node <<'NODE'
          const fs = require('fs')
          const dir = 'supabase/migrations'
          const files = fs.readdirSync(dir).filter((file) => file.endsWith('.sql')).sort()
          const seen = new Map()
          for (const file of files) {
            const version = file.split('_')[0]
            if (seen.has(version)) {
              console.error(`Duplicate Supabase migration version: ${version}`)
              console.error(`- ${seen.get(version)}`)
              console.error(`- ${file}`)
              process.exit(1)
            }
            seen.set(version, file)
          }
          console.log(`Checked ${files.length} Supabase migration files; no duplicate versions found.`)
          NODE
