name: Release Certification

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact deployment-candidate Git SHA (defaults to the selected ref)
        required: false
        type: string
      marketing_base:
        description: Candidate marketing origin
        required: true
        default: https://nexez.ai
        type: string
      app_base:
        description: Candidate authenticated-app origin
        required: true
        default: https://app.nexez.ai
        type: string
      agent_base:
        description: Candidate agent-runtime origin
        required: true
        default: https://nexez.app
        type: string

permissions:
  contents: read

concurrency:
  group: release-certification-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
      NEXT_PUBLIC_SITE_URL: https://nexez.app
      NEXEZ_RELEASE_CERT_SECRET: ${{ secrets.NEXEZ_RELEASE_CERT_SECRET }}
      NEXEZ_COMMIT_SHA: ${{ inputs.commit_sha || github.event.workflow_run.head_sha || github.sha }}
      NEXEZ_MARKETING_BASE: ${{ inputs.marketing_base || 'https://nexez.ai' }}
      NEXEZ_APP_BASE: ${{ inputs.app_base || 'https://app.nexez.ai' }}
      NEXEZ_AGENT_BASE: ${{ inputs.agent_base || 'https://nexez.app' }}
      NEXEZ_CI_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'success' }}
      NEXEZ_RELEASE_SOURCE: ${{ github.event_name == 'workflow_run' && 'github' || 'manual' }}
      NEXEZ_RELEASE_IDEMPOTENCY_KEY: github-${{ github.run_id }}-${{ github.run_attempt }}
      NEXEZ_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NEXEZ_TRIGGERED_BY: ${{ github.event.workflow_run.actor.login || github.actor }}
      NEXEZ_RELEASE_WAIT_MS: '600000'
      NEXEZ_RELEASE_REPORT_PATH: release-certification.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      # Automatic runs inherit a successful CI result. A manual recovery run
      # proves the same source gates itself before touching production evidence.
      - name: Manual source verification
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run lint -- --quiet
          npm run lint:palette
          npx tsc --noEmit --incremental false
          npm test
          npm run build

      - name: Certify exact deployment candidate
        id: certify
        continue-on-error: true
        run: npm run certify:release

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-certification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce promotion eligibility
        if: steps.certify.outcome == 'success'
        run: |
          node -e "const r=require('./release-certification.json'); if(r.status!=='passed'||r.promotionEligible!==true||r.commitSha!==process.env.NEXEZ_COMMIT_SHA) process.exit(1)"

      - name: Enforce release verdict
        if: steps.certify.outcome != 'success'
        run: exit 1
