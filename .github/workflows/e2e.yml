name: E2E

# Runs nightly, on app-touching PRs, and on demand. Requires repo secrets for the
# gated specs; without them those self-skip and the public smoke still runs:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY  (so the app renders)
#   E2E_EMAIL, E2E_PASSWORD                                        (dedicated test account)
#   LLM_API_KEY                                                    (real LLM call for the seeded llm_opt_in E2E)
# The public-page smoke runs regardless; the authed editor smoke runs only when
# E2E_EMAIL/E2E_PASSWORD are present, and the seeded llm_opt_in simulator E2E runs
# only when LLM_API_KEY is also present (each self-skips otherwise).
on:
  workflow_dispatch:
  # Nightly against main. The public-page smoke needs no secrets and so always runs;
  # the authed editor and seeded-LLM specs self-skip when theirs are absent, which is
  # what makes an unattended run safe rather than perpetually red.
  schedule:
    - cron: '0 7 * * *'
  # On PRs that touch the app itself. Path-filtered so a docs or migration PR does not
  # pay for a browser run, and because a green Playwright on a docs change tells you
  # nothing.
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    # Pin the runner family so an ubuntu-latest image rollover cannot silently
    # change Playwright's system dependency surface underneath the required gate.
    runs-on: ubuntu-24.04
    # Individual install phases have tighter hard ceilings below. This job-level
    # ceiling only leaves enough room for one bounded retry per install phase plus
    # the real browser suite; it must never fall back to GitHub's six-hour default.
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Secret key for the real LLM call; base URL/model are non-secret and must
      # match the key's provider (defaults below mirror playwright.config.ts).
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.x.ai/v1' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'grok-4.3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci

      # Keep apt/system-package failures separate from Playwright CDN/browser
      # failures. Each external-install phase gets one bounded retry so a transient
      # mirror/CDN hiccup does not impersonate a Nexez regression, while two failures
      # still leave the required E2E gate red and attributable to the exact phase.
      - name: Install Playwright system dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Playwright system dependency install attempt ${attempt}/2"
            if timeout --kill-after=15s 5m npx playwright install-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Playwright system dependency install failed twice"
              exit 1
            fi
            echo "::warning::Playwright system dependency install attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
        timeout-minutes: 12

      # Nexez runs Playwright headlessly with browserName=chromium and no channel
      # override, so the full headed Chromium bundle is unnecessary. --only-shell
      # installs the matching headless shell while the retry contains transient CDN
      # failures without changing browser semantics or weakening the test gate.
      - name: Install Chromium headless shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Chromium headless-shell install attempt ${attempt}/2"
            if timeout --kill-after=15s 4m npx playwright install --only-shell chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Chromium headless-shell install failed twice"
              exit 1
            fi
            echo "::warning::Chromium headless-shell install attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
        timeout-minutes: 10

      - name: Playwright E2E
        run: npm run test:e2e

      # Preserve the trace, DOM/error context, and failure screenshot instead of
      # forcing the next debugging session to infer the browser's final route.
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7
