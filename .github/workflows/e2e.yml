name: E2E

# Runs nightly, on app-touching PRs, and on demand. Requires repo secrets for the
# gated specs; without them those self-skip and the public smoke still runs:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY  (so the app renders)
#   E2E_EMAIL, E2E_PASSWORD                                        (dedicated test account)
#   LLM_API_KEY                                                    (real LLM call for the seeded llm_opt_in E2E)
# The public-page smoke runs regardless; the authed editor smoke runs only when
# E2E_EMAIL/E2E_PASSWORD are present, and the seeded llm_opt_in simulator E2E runs
# only when LLM_API_KEY is also present (each self-skips otherwise).
on:
  workflow_dispatch:
  # Nightly against main. The public-page smoke needs no secrets and so always runs;
  # the authed editor and seeded-LLM specs self-skip when theirs are absent, which is
  # what makes an unattended run safe rather than perpetually red.
  schedule:
    - cron: '0 7 * * *'
  # On PRs that touch the app itself. Path-filtered so a docs or migration PR does not
  # pay for a browser run, and because a green Playwright on a docs change tells you
  # nothing.
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A browser-install/network stall must fail visibly instead of occupying a runner
    # for GitHub's six-hour default. Healthy runs complete far below this ceiling.
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      # Secret key for the real LLM call; base URL/model are non-secret and must
      # match the key's provider (defaults below mirror playwright.config.ts).
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.x.ai/v1' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'grok-4.3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      # Nexez runs Playwright headlessly with browserName=chromium and no channel
      # override, so the full headed Chromium bundle is unnecessary. Playwright's
      # --only-shell mode installs the smaller chromium-headless-shell used by this
      # exact configuration while preserving the same browser engine semantics.
      - name: Install Playwright Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 8
      - name: Playwright E2E
        run: npm run test:e2e
