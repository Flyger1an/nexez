[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexez-agent-sdk"
version = "0.1.0"
description = "Python client for Nexez agent discovery, checkout validation, and negotiation handoff."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nexez" }]
keywords = ["nexez", "agents", "commerce", "sdk", "negotiation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://nexez.ai/agents"
Source = "https://github.com/Flyger1an/nexez/tree/main/sdk/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexez_agent_sdk = ["py.typed"]
